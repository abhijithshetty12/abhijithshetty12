- name: Contribution Koi Pond
  # You may pin to the exact commit or the version.
  # uses: 0xydev/koipond@0626bde8e1c0dd73ee6867ac8603d3f4fc2f2f9b
  uses: 0xydev/koipond@v1.0.0
  with:
    # GitHub user whose contribution graph feeds the pond
    github_user_name: 
    # Files to generate, one per line. Each line can be customized with a query string. Supported options: theme=light|dark, seed=<any string>

    outputs: # optional, default is dist/koipond-light.svg
dist/koipond-dark.svg?theme=dark

    # Token used to read the contribution calendar (falls back to public data when empty)
    github_token: # optional, default is ${{ github.token }}
